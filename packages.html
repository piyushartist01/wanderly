<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Explore Packages — Wanderly</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages/packages.css">
</head>
<body>

  <div class="container pt-20 pb-10" style="margin-top: 64px">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-display-md mb-2">Explore Packages</h1>
        <p class="text-muted">Curated experiences from ₹4,999 · All-inclusive · Free cancellation</p>
      </div>
    </div>

    <!-- Filters -->
    <div class="chip-row mb-6">
      <button class="chip active" onclick="filterCategory('All', this)">All</button>
      <button class="chip" onclick="filterCategory('Trekking', this)">Trekking</button>
      <button class="chip" onclick="filterCategory('Desert Trips', this)">Desert Trips</button>
      <button class="chip" onclick="filterCategory('Water Adventures', this)">Water Adventures</button>
      <button class="chip" onclick="filterCategory('Cultural', this)">Cultural</button>
      <button class="chip" onclick="filterCategory('Beach', this)">Beach</button>
      <button class="chip" onclick="filterCategory('Nature & Wildlife', this)">Nature & Wildlife</button>
      <button class="chip" onclick="filterCategory('Cycling', this)">Cycling</button>
    </div>

    <!-- Grid -->
    <div class="grid-3" id="packages-grid"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/packages.js"></script>
</body>
</html>
