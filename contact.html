<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contact Us — Wanderly</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container pt-20 pb-10" style="margin-top: 64px">
    <div class="text-center mb-8">
      <h1 class="text-display-md mb-2">Get in Touch</h1>
      <p class="text-muted max-w-2xl mx-auto" style="max-width:600px;margin:0 auto">Have a question, need help planning your trip, or just want to say hello? We're here for you.</p>
    </div>

    <div class="layout-detail">
      <!-- Contact Info -->
      <div>
        <div class="flex-col gap-4 mb-8" style="display:flex;flex-direction:column;gap:1rem">
          <div class="card p-4 flex items-center gap-4" style="padding:1rem;display:flex;align-items:center;gap:1rem">
            <div style="width:48px;height:48px;border-radius:50%;background:rgba(14,124,134,0.1);color:var(--teal);display:flex;align-items:center;justify-content:center" data-icon="phone"></div>
            <div>
              <div class="text-xs text-muted font-semibold uppercase tracking-wider mb-1" style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em">Call Us</div>
              <div class="font-semibold">+91 1234 567 890</div>
              <div class="text-xs text-muted mt-1">Mon–Sat, 9 AM – 7 PM IST</div>
            </div>
          </div>
          
          <div class="card p-4 flex items-center gap-4" style="padding:1rem;display:flex;align-items:center;gap:1rem">
            <div style="width:48px;height:48px;border-radius:50%;background:rgba(14,124,134,0.1);color:var(--teal);display:flex;align-items:center;justify-content:center" data-icon="mail"></div>
            <div>
              <div class="text-xs text-muted font-semibold uppercase tracking-wider mb-1" style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em">Email Us</div>
              <div class="font-semibold">hello@wanderly.in</div>
              <div class="text-xs text-muted mt-1">We reply within 24 hours</div>
            </div>
          </div>
          
          <div class="card p-4 flex items-center gap-4" style="padding:1rem;display:flex;align-items:center;gap:1rem">
            <div style="width:48px;height:48px;border-radius:50%;background:rgba(14,124,134,0.1);color:var(--teal);display:flex;align-items:center;justify-content:center" data-icon="mapPin"></div>
            <div>
              <div class="text-xs text-muted font-semibold uppercase tracking-wider mb-1" style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em">Visit Us</div>
              <div class="font-semibold">Wanderly HQ, Indiranagar</div>
              <div class="text-xs text-muted mt-1">Bangalore, Karnataka 560038</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div>
        <div class="card p-6" style="padding:2rem">
          <h2 class="text-display-sm mb-6">Send Us a Message</h2>
          <form onsubmit="event.preventDefault(); showToast('Message sent! We will get back to you soon.', 'success'); this.reset();">
            <div class="grid-2 mb-4">
              <div class="form-group mb-0">
                <label>Full Name *</label>
                <input type="text" class="form-input" required placeholder="Your name">
              </div>
              <div class="form-group mb-0">
                <label>Email *</label>
                <input type="email" class="form-input" required placeholder="your@email.com">
              </div>
            </div>
            <div class="grid-2 mb-4">
              <div class="form-group mb-0">
                <label>Phone (optional)</label>
                <input type="tel" class="form-input" placeholder="+91 XXXXX XXXXX">
              </div>
              <div class="form-group mb-0">
                <label>Subject</label>
                <select class="form-input">
                  <option>General Enquiry</option>
                  <option>Custom Trip Planning</option>
                  <option>Existing Booking</option>
                  <option>Partnership/Press</option>
                </select>
              </div>
            </div>
            <div class="form-group mb-6">
              <label>Your Message *</label>
              <textarea class="form-input" required placeholder="Tell us how we can help..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="display:inline-flex;align-items:center;gap:8px"><span data-icon="send"></span> Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    initPage('contact');
  </script>
</body>
</html>
