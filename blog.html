<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Travel Journal — Wanderly</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .blog-card { background: var(--bg-surface); border-radius: var(--radius-card); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s ease; text-decoration: none; color: inherit; box-shadow: var(--shadow-card); }
    .blog-card:hover { transform: translateY(-4px); }
    .blog-card-img { height: 200px; background: var(--bg); position: relative; }
    .blog-card-body { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; }
    .blog-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 1rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  </style>
</head>
<body>

  <div class="container pt-20 pb-10" style="margin-top: 64px">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-display-md mb-2">The Travel Journal</h1>
        <p class="text-muted">Stories, guides, and tips from the Wanderly community.</p>
      </div>
    </div>

    <div class="grid-3" id="blog-grid"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    initPage('blog');
    
    function renderBlogCard(post, index) {
      // Generate some distinct abstract art for each post to serve as the header image
      const colors = [
        ['#1A3A50', '#1F7A8C'],
        ['#2E8B57', '#3CB371'],
        ['#D9694A', '#F2A03D'],
        ['#4A6B7F', '#8a7a6a']
      ][index % 4];

      const art = `<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%">
        <defs><linearGradient id="g${index}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${colors[0]}"/><stop offset="100%" stop-color="${colors[1]}"/></linearGradient></defs>
        <rect width="100%" height="100%" fill="url(#g${index})"/>
        <circle cx="${Math.random()*400}" cy="${Math.random()*200}" r="${Math.random()*100 + 50}" fill="white" opacity="0.1"/>
        <circle cx="${Math.random()*400}" cy="${Math.random()*200}" r="${Math.random()*100 + 50}" fill="white" opacity="0.1"/>
      </svg>`;

      return `
        <a href="post.html?slug=${post.slug}" class="blog-card">
          <div class="blog-card-img">${art}</div>
          <div class="blog-card-body">
            <div class="blog-meta">
              <span>${post.category}</span>
              <span>${post.readTime} min read</span>
            </div>
            <h2 style="font-family:var(--font-display);font-size:1.25rem;font-weight:600;margin-bottom:0.5rem;line-height:1.4">${post.title}</h2>
            <p class="text-muted text-sm line-clamp-2" style="margin-bottom:1rem;flex:1">${post.excerpt}</p>
            <div style="font-size:0.875rem;font-weight:500">${post.author}</div>
          </div>
        </a>
      `;
    }

    document.getElementById('blog-grid').innerHTML = blogPosts.map(renderBlogCard).join('');
  </script>
</body>
</html>
