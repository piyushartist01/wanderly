<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Explore Destinations — Wanderly</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages/explore.css">
</head>
<body>

  <div class="container pt-20 pb-10" style="margin-top: 64px">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-display-md mb-2">Explore the World</h1>
        <p class="text-muted">Discover our curated list of breathtaking destinations.</p>
      </div>
    </div>

    <!-- Search & Filters -->
    <div class="search-pill mb-8" style="margin: 0 0 2rem 0; max-width: 100%">
      <div style="display:flex;align-items:center;flex:2;padding-left:0.5rem">
        <span style="color:var(--text-muted);width:20px;margin-left:1rem;display:flex" data-icon="search"></span>
        <input type="text" id="search-input" placeholder="Search destinations..." style="width:100%" onkeyup="filterDestinations()">
      </div>
      <div class="divider"></div>
      <div style="display:flex;align-items:center;flex:1">
        <span style="color:var(--text-muted);width:20px;margin-left:1rem;display:flex" data-icon="mapPin"></span>
        <select id="region-filter" onchange="filterDestinations()">
          <option value="All">All Regions</option>
          <option value="Uttarakhand">Uttarakhand</option>
          <option value="Rajasthan">Rajasthan</option>
          <option value="Jammu & Kashmir">Jammu & Kashmir</option>
          <option value="Goa">Goa</option>
          <option value="Andaman & Nicobar">Andaman & Nicobar</option>
          <option value="Kerala">Kerala</option>
        </select>
      </div>
    </div>

    <!-- Grid -->
    <div class="grid-4" id="destinations-grid"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/explore.js"></script>
</body>
</html>
